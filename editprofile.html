<!DOCTYPE html>
<html lang="en">
<head>
    <title>Profile</title>
    <link rel="stylesheet" href="css/editprofile.css">
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="profile-container">
                <img src="images/images.png" alt="Profile Icon" class="profile-icon">
                <div class="dropdown">
                    <button class="dropdown-btn">▾</button>
                    <div class="dropdown-content">
                        <a href="home.html">Home</a>
                        <a href="documentsearch.html">Search ByLaws</a>
                        <a href="#">Logout</a>
                    </div>
                </div>
            </div>
            <h1 class="page-title">Edmonton Bylaws</h1>
        </div>
    </header>
    <!-- Removed Sidebar Button -->
    <div class="container">
        <!-- Removed Sidebar -->
        <div class="container">
            <div class="banner">
                <h1 class="hello-prompt">Welcome, User</h1>
                <p></p>
            </div>

            <section class="profile-details">
                <div class="profile-picture">
                    <img src="https://t3.ftcdn.net/jpg/05/16/27/58/360_F_516275801_f3Fsp17x6HQK0xQgDQEELoTuERO4SsWV.jpg" alt="Profile Picture" />
                </div>
                <div class="info">
                    <form class="info-form">
                        <label>First Name</label><br>
                        <input type="text" id="firstNameInput" placeholder="Example"><br>
                        <label>Last Name</label><br>
                        <input type="text" id="lastNameInput" placeholder="Person"><br>
                        <label>E-Mail</label><br>
                        <input type="email" id="emailInput" placeholder="ExamplePerson@email.com"><br>
                        <button class="edit" role="button" onclick="getUpdatedInfo()">Save Profile</button>
                    </form>
                </div>
            </section>
        </div>
    </div>
    <script src="js/editprofile.js"></script>
</body>
</html>
