<!DOCTYPE html>
<html lang="en">
    <head> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Edmonton Bylaw Chatbot</title>
        
        <link rel="stylesheet" href="css/home.css">
    </head>
    
    <body>
        <header>
            <div class="header-container">
                <div class="profile-container">
                    <img src="images/images.png" alt="Profile Icon" class="profile-icon">
                    <div class="dropdown">
                        <button class="dropdown-btn">▾</button>
                        <div class="dropdown-content">
                            <a href="editprofile.html">Edit Profile</a>
                            <a href="#">Logout</a>
                        </div>
                    </div>
                </div>
                <h1 class="page-title">Edmonton Bylaws</h1>
            </div>
        </header>
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="container">
        <aside class="sidebar">
            <nav>
                <ul>
                    <br>
                    <br>
                    <br>
                    <li><a href="documentsearch.html">Search Bylaws</a></li>
                    <li><a href="chathistory.html">Chat History</a></li>
                </ul>
            </nav>
        </aside>

        <main class="chat">
            <h1>Welcome to the Edmonton Bylaw Chatbot</h1>
            <p>Ask any question regarding Edmonton's bylaws, and we'll assist you.</p>
    
            <!-- Chat Area -->
            <div class="chat-area" id="chatArea">
                <!-- Messages will be displayed here -->
            </div>
    
            <!-- Chat Input Box -->
            <div class="chat-box">
                <input type="text" id="userMessageInput" placeholder="Type your message..." />
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </main>
        <script src="js/home.js"></script>
    </div>
</body>
</html>
