<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="css/login.css">
    </head>
    <body>
        <div class="login-box">
            <header class="login-header">Edmonton Bylaws</header>
            <h1 class="login-h1">Login</h1>
            <form class="login-form">
                <input type="text" placeholder="Email" id="email-text-input" class="login-inputs"><br>
                <input type="password" placeholder="Password" id="password-password-input" class="login-inputs"><br>
            </form>
            <a href="home.html">
                <button id="submit-button" onclick="getUserLoginDTO()">Log in</button><br>
            </a>
            <p class="sign-up">Don't have an account? <a href="sign.html">Sign Up</a></p>        
        </div>
        <script src="js/auth.js"></script>
    </body>
</html>
