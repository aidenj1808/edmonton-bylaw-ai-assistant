<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Bylaws</title>
    
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="document-search-view-page.css">
    <link rel="stylesheet" href="components/sidebar.css">
    <link rel="stylesheet" href="components/header.css">
    <!-- Link to external JavaScript -->
    <script src="document-search-view-page.js"></script>
    
    <!-- You can include other meta tags for SEO here -->
</head>
<body>
    <!-- Placeholder for header -->
    <div id="header-container"></div> 
    <script>
        // Load the header
        fetch("components/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header-container").innerHTML = data;
            });
    </script>
    
    <div class="container">
        <!-- Placeholder for sidebar -->
        <div id="sidebar-container"></div> 
        <script>
            // Load the sidebar
            fetch("components/sidebar.html")
                .then(response => response.text())
                .then(data => {
                    document.getElementById("sidebar-container").innerHTML = data;
                });
        </script>

        <!-- Main Content Section -->
        <main class="main-content">
            <section id="home">
                <h1>Welcome Edmonton Bylaw Chat bot </h1>
                <p>This is where the documentation for all the bylaws are stored.</p>
                <div class="search-container">
                    <input type="text" placeholder="Search..." id="searchInput" oninput="searchPDFs()">
                    <button type="button">Search</button>
                </div>
            </section>
            <section class="pdf-container">
                <object class="pdf" data="data/2012_Quarters_Downtown_Revitalization_Levy_Rate_and_Supplementary_Levy_Rate_Bylaw_16099.pdf" width="800" height="500"></object>
                <!-- <iframe class="pdf" src="data/2013_Belvedere_Community_Revitalization_Levy_Rate_and_Supplementary_Levy_Rate.pdf" width="800" height="500"></iframe>
                <embed class="pdf" src="data/2013_Quarters_Downtown_Community_Revitalization_Levy_Rate_and_Supplementary_Levy_Rate_Bylaw_16429.pdf" width="800" height="500"></embed> -->
                <object class="pdf" data="data/2014_Quarters_Downtown_Revitalization_Levy_Rate_and_Supplementary_Levy_Rate_Bylaw_16805.pdf" width="800" height="500"></object>
                <object class="pdf" data="data/2022_Belvedere_Community_Revitalization_Levy_Rate_and_Supplementary_Levy_Rate_Bylaw.pdf" width="800" height="500"></object>
                <object class="pdf" data="data/Animal_Licensing_and_Control_Bylaw_13145.pdf" width="800" height="500"></object>
                <object class="pdf" data="data/Bullying.pdf" width="800" height="500"></object>
                <object class="pdf" data="data/Bylaw_13956.pdf" width="800" height="500"></object>
                <object class="pdf" data="data/Business_Improvement_Area_Assessment_Supplementary_Assessment_Tax_Supplementary_Tax_and_Tax_Rate_2022.pdf" width="800" height="500"></object>
                <object class="pdf" data="data/40_kmh_Default_Residential_Speed_Law_Bylaw_19282.pdf" width="800" height="500"></object>
                
            </section>
        </main>
    </div>
    
    <!-- Footer Section -->
    <footer>
        <p>&copy; 2025 Company Name. All rights reserved.</p>
    </footer>
    
</body>
</html>
