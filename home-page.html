<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edmonton Bylaw Chatbot</title>
    <link rel="stylesheet" href="home-page.css">
    <script>
        function sendMessage() {
            let message = document.getElementById("chatInput").value;
            if (message.trim() !== "") {
                alert("You sent: " + message);
            } else {
                alert("Please enter a message.");
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Edmonton Bylaws</h2>
            <nav>
                <ul>
                    <li>Home</li>
                    <li>Common Bylaws</li>
                    <li>Report an Issue</li>
                    <li>FAQs</li>
                    <li>Contact</li>
                </ul>
            </nav>
        </aside>
        <main class="chat">
            <h1>Welcome to the Edmonton Bylaw Chatbot</h1>
            <p>Ask any question regarding Edmonton's bylaws, and we'll assist you.</p>
            <div class="chat-box">
                <input type="text" id="chatInput" placeholder="Type your question here...">
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
            <div class="actions">
                <button>View Parking Rules</button>
                <button>Report Noise Complaint</button>
                <button>Check Business Regulations</button>
                <button>Learn About Pet Bylaws</button>
            </div>
        </main>
    </div>
</body>
</html>
