<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edmonton Bylaw Chatbot</title>
    <link rel="stylesheet" href="home-page.css">
    <script>
        function toggleSidebar() {
            document.querySelector(".sidebar").classList.toggle("open");
        }

        function submitBackgroundInput() {
            let userInput = document.getElementById("background-input").value;
            if (userInput.trim() !== "") {
                alert("Background input submitted: " + userInput);
                document.getElementById("background-input").value = "";
            } else {
                alert("Please enter some text before submitting.");
            }
        }

    </script>
</head>
<body>
    <button class="menu-btn" onclick="toggleSidebar()">☰ Menu</button>
    <div class="container">
        <aside class="sidebar">
            <nav>
                <ul>
                    <br>
                    <br>
                    <li>Home</li>
                    <li>Common Bylaws</li>
                    <li>Report an Issue</li>
                    <li><a href="chat-history-page.html">Chat History</a></li>
                    <li>FAQs</li>
                    <li>Contact</li>
                </ul>
            </nav>
        </aside>

        <main class="chat">
            <h1>Welcome to the Edmonton Bylaw Chatbot</h1>
            <p>Ask any question regarding Edmonton's bylaws, and we'll assist you.</p>

            <!-- Background Composer Input -->
            <div class="background-composer">
                <textarea id="background-input" placeholder="Enter your background information..."></textarea>
                <button onclick="submitBackgroundInput()">Submit</button>
            </div>

        </main>
    </div>
</body>
</html>
