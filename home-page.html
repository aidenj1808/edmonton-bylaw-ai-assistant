<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edmonton Bylaw Chatbot</title>
    <link rel="stylesheet" href="home-page.css">
    <link rel="stylesheet" href="components/sidebar.css">
    <link rel="stylesheet" href="components/header.css">
    <script>
        function sendMessage() {
            let message = document.getElementById("chatInput").value;
            if (message.trim() !== "") {
                alert("You sent: " + message);
            } else {
                alert("Please enter a message.");
            }
        }
    </script>
</head>
<body>
    <!-- Placeholder for header -->
    <div id="header-container"></div> 
    <script>
        // Load the sidebar
        fetch("components/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header-container").innerHTML = data;
            });
    </script>

    <div class="container">
        <!-- Placeholder for sidebar -->
        <div id="sidebar-container"></div> 
        <script>
            // Load the sidebar
            fetch("components/sidebar.html")
                .then(response => response.text())
                .then(data => {
                    document.getElementById("sidebar-container").innerHTML = data;
                });
        </script>

        <main class="chat">
            <h1 style="color: #eceeef; margin: 0;">Welcome to the Edmonton Bylaw Chatbot</h1>
            <p>Ask any question regarding Edmonton's bylaws, and we'll assist you.</p>
            <div class="actions">
                <button>View Parking Rules</button>
                <button>Report Noise Complaint</button>
                <button>Check Business Regulations</button>
                <button>Learn About Pet Bylaws</button>
            </div>
        </main>
    </div>
    <div class="chat-box">
        <input type="text" id="chatInput" placeholder="Type your question here...">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
</body>
</html>
