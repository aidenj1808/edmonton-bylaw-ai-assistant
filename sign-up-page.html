<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="sign-up-page.css">
    </head>
    <body>
        <div class="sign-up-box">
            <header class="sign-up-header">Edmonton Bylaws</header>
            <h1 class="sign-up-h1">Create Account</h1>
            <form class="sign-up-form">
                <input type="text" placeholder="First Name" id="first-name-text-input" class="sign-up-inputs"><br>
                <input type="text" placeholder="Last Name" id="last-name-text-input" class="sign-up-inputs"><br>
                <input type="text" placeholder="Email" id="email-text-input" class="sign-up-inputs"><br>
                <input type="password" placeholder="Password" id="password-password-input" class="sign-up-inputs"><br>
            </form>
            <a href="home-page.html">
                <button id="sign-up-button">Sign Up</button><br>  
            </a>   
            <p>Already have an account? <a href="login-page.html">Login </a></p>
        </div>
    </body>
</html>
